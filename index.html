// Helper Functions
function formatDateIndonesian(dateStr) {
  if (!dateStr) return '';
  try {
    const months = [
      'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
      'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
    ];
    const parts = dateStr.split('-');
    if (parts.length === 3) {
      const day = parseInt(parts[2], 10);
      const month = months[parseInt(parts[1], 10) - 1];
      const year = parts[0];
      return `${day} ${month} ${year}`;
    }
    return dateStr;
  } catch (e) {
    return dateStr;
  }
}

// Synthesizer Audio Helpers
let audioCtx = null;
let ambientInterval = null;

function playPaperRustleSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.35);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.36);
  } catch (e) {}
}

function playWaxBreakSound() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(580, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(240, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.22);
  } catch (e) {}
}

function App() {
  // State
  const [memories, setMemories] = useState(() => {
    try {
      const cached = localStorage.getItem('rj_memories_fallback');
      return cached ? JSON.parse(cached) : DEFAULT_MEMORIES;
    } catch (e) {
      return DEFAULT_MEMORIES;
    }
  });

  const [messages, setMessages] = useState(() => {
    try {
      const cached = localStorage.getItem('rj_messages');
      return cached ? JSON.parse(cached) : DEFAULT_MESSAGES;
    } catch (e) {
      return DEFAULT_MESSAGES;
    }
  });

  const [isAdmin, setIsAdmin] = useState(() => {
    return sessionStorage.getItem('rj_is_admin') === 'true';
  });

  const [likedMemories, setLikedMemories] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('rj_likes') || '[]');
      return new Set(saved);
    } catch (e) {
      return new Set();
    }
  });

  const [activeFilter, setActiveFilter] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [cloudStatus, setCloudStatus] = useState('syncing'); // 'connected', 'syncing', 'offline'
  const [toasts, setToasts] = useState([]);
  const [isAmbientPlaying, setIsAmbientPlaying] = useState(false);

  // Modals
  const [isEnvelopeOpen, setIsEnvelopeOpen] = useState(false);
  const [isEnvelopeUnfolded, setIsEnvelopeUnfolded] = useState(false);
  const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
  const [adminActiveTab, setAdminActiveTab] = useState('tabUpload');
  const [isWriteModalOpen, setIsWriteModalOpen] = useState(false);
  const [selectedDetailMemory, setSelectedDetailMemory] = useState(null);
  const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);

  // Firebase DB ref
  const dbRef = useRef(null);

  // Show Toast Helper
  const showToast = useCallback((message, type = 'info') => {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts(prev => prev.filter(t => t.id !== id));
    }, 3500);
  }, []);

  // Initialize Firebase RTDB
  useEffect(() => {
    if (typeof firebase !== 'undefined') {
      try {
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        dbRef.current = database;

        if (firebase.analytics) {
          try { firebase.analytics(); } catch (e) {}
        }

        // Connection listener
        database.ref('.info/connected').on('value', snap => {
          if (snap.val() === true) {
            setCloudStatus('connected');
          } else {
            setCloudStatus('offline');
          }
        });

        // Realtime memories listener
        database.ref('memories').on('value', snapshot => {
          const data = snapshot.val();
          if (data) {
            let list = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
            list.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            setMemories(list);
            try {
              localStorage.setItem('rj_memories_fallback', JSON.stringify(list));
            } catch (e) {}
          }
        });

        // Realtime messages listener
        database.ref('messages').on('value', snapshot => {
          const data = snapshot.val();
          if (data) {
            let list = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
            list.sort((a, b) => (b.id > a.id ? 1 : -1));
            setMessages(list);
            try {
              localStorage.setItem('rj_messages', JSON.stringify(list));
            } catch (e) {}
          }
        });

      } catch (err) {
        console.warn('Firebase init error:', err);
        setCloudStatus('offline');
      }
    } else {
      setCloudStatus('offline');
    }
  }, []);

  // Sync likes to localStorage
  const saveLikes = useCallback((newSet) => {
    try {
      localStorage.setItem('rj_likes', JSON.stringify(Array.from(newSet)));
    } catch (e) {}
  }, []);

  // Like Toggle Handler
  const toggleLike = useCallback((id) => {
    const isLiked = likedMemories.has(id);
    const nextLiked = new Set(likedMemories);

    if (isLiked) {
      nextLiked.delete(id);
    } else {
      nextLiked.add(id);
      showToast('Terima kasih apresiasinya untuk momen ini! ❤️', 'success');
    }

    setLikedMemories(nextLiked);
    saveLikes(nextLiked);

    // Optimistic UI update
    setMemories(prev => prev.map(m => {
      if (m.id === id) {
        return {
          ...m,
          likes: isLiked ? Math.max(0, (m.likes || 1) - 1) : (m.likes || 0) + 1
        };
      }
      return m;
    }));

    // Firebase transaction
    if (dbRef.current) {
      dbRef.current.ref('memories/' + id + '/likes').transaction(curr => {
        const val = typeof curr === 'number' ? curr : 0;
        return isLiked ? Math.max(0, val - 1) : val + 1;
      });
    }
  }, [likedMemories, saveLikes, showToast]);

  // Ambient Nostalgia Synthesizer
  const toggleAmbientSound = useCallback(() => {
    if (!audioCtx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtx();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (isAmbientPlaying) {
      if (ambientInterval) {
        clearInterval(ambientInterval);
        ambientInterval = null;
      }
      setIsAmbientPlaying(false);
      showToast('Suasana nostalgia dijeda.', 'info');
    } else {
      setIsAmbientPlaying(true);
      showToast('Suasana nostalgia berputar 🎵', 'info');

      // Chords sequence
      const chords = [
        [261.63, 329.63, 392.00, 493.88], // Cmaj7
        [220.00, 261.63, 329.63, 392.00], // Am7
        [174.61, 220.00, 261.63, 329.63], // Fmaj7
        [196.00, 246.94, 293.66, 349.23]  // G7
      ];
      let chordIndex = 0;

      const playChord = () => {
        if (!audioCtx) return;
        const notes = chords[chordIndex % chords.length];
        chordIndex++;
        notes.forEach((freq, i) => {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.02, audioCtx.currentTime + 1.2 + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + i * 0.08);
            osc.stop(audioCtx.currentTime + 4.5);
          } catch (e) {}
        });
      };

      playChord();
      ambientInterval = setInterval(playChord, 4600);
    }
  }, [isAmbientPlaying, showToast]);

  // Derived Stats
  const uniqueProkers = useMemo(() => {
    return Array.from(new Set(memories.map(m => m.proker).filter(Boolean)));
  }, [memories]);

  // Filtered Memories
  const filteredMemories = useMemo(() => {
    let list = [...memories];
    if (activeFilter !== 'all') {
      list = list.filter(m => m.proker === activeFilter);
    }
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase().trim();
      list = list.filter(m => {
        const titleMatch = m.title && m.title.toLowerCase().includes(q);
        const prokerMatch = m.proker && m.proker.toLowerCase().includes(q);
        const storyMatch = m.story && m.story.toLowerCase().includes(q);
        const peopleStr = Array.isArray(m.people) ? m.people.join(' ') : String(m.people || '');
        const peopleMatch = peopleStr.toLowerCase().includes(q);
        return titleMatch || prokerMatch || storyMatch || peopleMatch;
      });
    }
    return list;
  }, [memories, activeFilter, searchQuery]);

  // Login Handler
  const handleLogin = (user, pass) => {
    if (user.toUpperCase() === 'ADALAH' && pass.toUpperCase() === 'KOMISI2') {
      setIsAdmin(true);
      sessionStorage.setItem('rj_is_admin', 'true');
      setIsEnvelopeOpen(false);
      setIsAdminModalOpen(true);
      showToast('Selamat datang di Dasbor Admin Ruang Jejak! ✨', 'success');
      return true;
    }
    return false;
  };

  const handleLogout = () => {
    setIsAdmin(false);
    sessionStorage.removeItem('rj_is_admin');
    setIsAdminModalOpen(false);
    showToast('Sesi admin telah ditutup.', 'info');
  };

  // Add Memory
  const handleAddMemory = async (newMemory) => {
    setMemories(prev => [newMemory, ...prev]);
    if (dbRef.current) {
      setCloudStatus('syncing');
      try {
        await dbRef.current.ref('memories/' + newMemory.id).set(newMemory);
        setCloudStatus('connected');
      } catch (e) {
        console.warn('Firebase save memory error:', e);
      }
    }
    showToast(`Kenangan "${newMemory.title}" berhasil diarsipkan! 🎉`, 'success');
  };

  // Toggle Featured
  const handleToggleFeatured = async (id) => {
    const item = memories.find(m => m.id === id);
    if (!item) return;
    const newFeatured = !item.featured;

    setMemories(prev => prev.map(m => m.id === id ? { ...m, featured: newFeatured } : m));

    if (dbRef.current) {
      try {
        await dbRef.current.ref('memories/' + id + '/featured').set(newFeatured);
      } catch (e) {}
    }
    showToast(`Status sorotan untuk "${item.title}" diperbarui.`, 'info');
  };

  // Delete Memory
  const handleDeleteMemory = async (id) => {
    const item = memories.find(m => m.id === id);
    if (!item) return;

    if (window.confirm(`Apakah kamu yakin ingin menghapus kenangan "${item.title}"?`)) {
      setMemories(prev => prev.filter(m => m.id !== id));
      if (dbRef.current) {
        try {
          await dbRef.current.ref('memories/' + id).remove();
        } catch (e) {}
      }
      showToast('Foto kenangan berhasil dihapus.', 'info');
    }
  };

  // Add Message
  const handleAddMessage = async (newMsg) => {
    setMessages(prev => [newMsg, ...prev]);
    if (dbRef.current) {
      setCloudStatus('syncing');
      try {
        await dbRef.current.ref('messages/' + newMsg.id).set(newMsg);
        setCloudStatus('connected');
      } catch (e) {}
    }
    showToast('Suratmu telah disematkan di dinding apresiasi! ✨', 'success');
  };

  // Delete Message
  const handleDeleteMessage = async (id) => {
    if (window.confirm('Hapus surat apresiasi ini dari papan?')) {
      setMessages(prev => prev.filter(m => m.id !== id));
      if (dbRef.current) {
        try {
          await dbRef.current.ref('messages/' + id).remove();
        } catch (e) {}
      }
      showToast('Pesan berhasil dihapus.', 'info');
    }
  };

  // Reset to Defaults
  const handleResetDefaults = async () => {
    if (window.confirm('Kembalikan semua galeri foto dan pesan ke versi awal?')) {
      setMemories(DEFAULT_MEMORIES);
      setMessages(DEFAULT_MESSAGES);
      if (dbRef.current) {
        const memUpdates = {};
        DEFAULT_MEMORIES.forEach(m => { memUpdates[m.id] = m; });
        const msgUpdates = {};
        DEFAULT_MESSAGES.forEach(m => { msgUpdates[m.id] = m; });
        await dbRef.current.ref('memories').set(memUpdates);
        await dbRef.current.ref('messages').set(msgUpdates);
      }
      showToast('Data berhasil di-reset ke pengaturan awal.', 'success');
    }
  };

  // Import Backup
  const handleImportBackup = async (parsed) => {
    if (Array.isArray(parsed.memories)) {
      setMemories(parsed.memories);
      if (dbRef.current) {
        const memUpdates = {};
        parsed.memories.forEach(m => { memUpdates[m.id] = m; });
        await dbRef.current.ref('memories').set(memUpdates);
      }
    }
    if (Array.isArray(parsed.messages)) {
      setMessages(parsed.messages);
      if (dbRef.current) {
        const msgUpdates = {};
        parsed.messages.forEach(m => { msgUpdates[m.id] = m; });
        await dbRef.current.ref('messages').set(msgUpdates);
      }
    }
    showToast('Cadangan data berhasil dipulihkan!', 'success');
  };

  return (

        <button

          aria-label="Toggle Musik Suasana"
        >
          <i className="fa-solid fa-music note-icon"></i>
          <span className="ambient-text">
            {isAmbientPlaying ? 'Suasana Nostalgia: Aktif' : 'Suasana Nostalgia: Mati'}

          <nav className="nav-links">

            <a href="#linimasa" className="nav-item"><i className="fa-solid fa-timeline"></i> Linimasa Proker</a>

          </nav>

          <div className="nav-actions">

            </button>

          </div>
        ))}
      </div>
    </div>
  );

// SUB-COMPONENT: EnvelopeModal
// ============================================================================
function EnvelopeModal({ isOpen, isUnfolded, onClose, onUnfold, onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [showPwd, setShowPwd] = useState(false);
  const [errorMsg, setErrorMsg] = useState('');

  if (!isOpen) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    const success = onLogin(username, password);
    if (!success) {
      setErrorMsg('Nama pengguna atau kata sandi tidak cocok. Gunakan akun uji coba yang tertera.');
    } else {
      setErrorMsg('');
      setUsername('');
      setPassword('');
    }
  };

  const fillQuickCreds = () => {
    setUsername('ADALAH');
    setPassword('KOMISI2');
    setErrorMsg('');
  };

  return (
    <div className="modal-backdrop active" role="dialog" aria-modal="true">
      <div className="envelope-modal-wrapper">
        <button className="modal-close-btn" onClick={onClose} aria-label="Tutup">
          <i className="fa-solid fa-xmark"></i>
        </button>

        <div className="envelope-stage">
          <div className={`envelope-container ${isUnfolded ? 'opened' : ''}`}>
            <div className="envelope-back"></div>

            {/* The sliding letter form */}
            <div className="envelope-letter">
              <div className="letter-inner">
                <div className="letter-header">
                  <span className="letter-seal-mini"><i className="fa-solid fa-stamp"></i></span>
                  <span className="letter-tag">Akses Resmi Pengurus</span>
                  <h3 className="letter-title">Pintu Ruang Kenangan</h3>
                  <p className="letter-sub">Masuk untuk mengelola dokumentasi proker atau menambah foto baru.</p>
                </div>

                <form className="letter-form" onSubmit={handleSubmit} autoComplete="off">
                  <div className="form-group">
                    <label htmlFor="reactAdminUser"><i className="fa-regular fa-user"></i> Nama Pengguna</label>
                    <input
                      type="text"
                      id="reactAdminUser"
                      className="form-input"
                      value={username}
                      onChange={(e) => setUsername(e.target.value)}
                      placeholder="Masukkan username"
                      required
                    />
                  </div>

                  <div className="form-group">
                    <label htmlFor="reactAdminPwd"><i className="fa-solid fa-key"></i> Kata Sandi</label>
                    <div className="password-wrapper">
                      <input
                        type={showPwd ? 'text' : 'password'}
                        id="reactAdminPwd"
                        className="form-input"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        placeholder="Masukkan kata sandi"
                        required
                      />
                      <button
                        type="button"
                        className="toggle-pwd-btn"
                        onClick={() => setShowPwd(p => !p)}
                        aria-label="Tampilkan sandi"
                      >
                        <i className={showPwd ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'}></i>
                      </button>
                    </div>
                  </div>

                  {errorMsg && (
                    <div className="login-feedback error">
                      <i className="fa-solid fa-circle-exclamation"></i> {errorMsg}
                    </div>
                  )}

                  <button type="submit" className="btn btn-primary w-100 btn-submit-login">
                    <i className="fa-solid fa-arrow-right-to-bracket"></i> Masuk ke Dasbor Admin
                  </button>

                  <div className="quick-admin-hint">
                    <p className="hint-title"><i className="fa-solid fa-circle-info"></i> Info Akun Akses (Uji Coba):</p>
                    <div className="hint-badges">
                      <span className="credential-pill" onClick={fillQuickCreds} title="Klik untuk isi otomatis">
                        Username: <strong>ADALAH</strong> | Sandi: <strong>KOMISI2</strong>
                      </span>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <div className="envelope-front-pocket"></div>

            {/* Top flap with wax seal */}
            <div className="envelope-flap">
              <div
                className="wax-seal"
                onClick={onUnfold}
                title="Klik Segel Lilin untuk Membuka Amplop"
                role="button"
                tabIndex={0}
              >
                <div className="wax-seal-inner">
                  <span className="wax-monogram">RJ</span>
                </div>
                <div className="wax-pulse"></div>
              </div>
            </div>
          </div>

          {!isUnfolded && (
            <div className="envelope-instruction">
              <i className="fa-regular fa-hand-pointer pulse-icon"></i>
              <span>Ketuk segel lilin merah di atas untuk membuka amplop</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function AdminModal({
  isOpen,
  activeTab,
  setActiveTab,
  onClose,
  onLogout,
  memories,
  messages,
  onAddMemory,
  onToggleFeatured,
  onDeleteMemory,
  onDeleteMessage,
  onResetDefaults,
  onImportBackup
}) {
  // Upload form state
  const [photoPreview, setPhotoPreview] = useState(null);
  const [urlInput, setUrlInput] = useState('');
  const [title, setTitle] = useState('');
  const [proker, setProker] = useState('');
  const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
  const [people, setPeople] = useState('');
  const [story, setStory] = useState('');
  const [featured, setFeatured] = useState(false);
  const [adminSearch, setAdminSearch] = useState('');

  const fileInputRef = useRef(null);
  const importInputRef = useRef(null);

  if (!isOpen) return null;

  const handleImageFile = (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1200;
        let w = img.width;
        let h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        setPhotoPreview(canvas.toDataURL('image/webp', 0.4));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handleUploadSubmit = (e) => {
    e.preventDefault();
    const imgSrc = photoPreview || urlInput.trim();
    if (!imgSrc) {
      alert('Harap pilih berkas foto atau isi URL gambar!');
      return;
    }

    const newMem = {
      id: 'mem-' + Date.now(),
      title: title.trim(),
      proker: proker.trim(),
      date: date || new Date().toISOString().split('T')[0],
      image: imgSrc,
      people: people.split(',').map(s => s.trim()).filter(Boolean),
      story: story.trim(),
      likes: 0,
      featured
    };

    onAddMemory(newMem);
    // Reset form
    setPhotoPreview(null);
    setUrlInput('');
    setTitle('');
    setProker('');
    setPeople('');
    setStory('');
    setFeatured(false);
    setActiveTab('tabManage');
  };

  const exportBackupJSON = () => {
    const backupData = {
      exportDate: new Date().toISOString(),
      memories,
      messages
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    const dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", `ruang-jejak-cadangan-${Date.now()}.json`);
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
  };

  const handleImportFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        onImportBackup(parsed);
      } catch (err) {
        alert('Gagal membaca berkas JSON cadangan.');
      }
    };
    reader.readAsText(file);
  };

  const filteredAdminMemories = memories.filter(m => {
    if (!adminSearch.trim()) return true;
    const q = adminSearch.toLowerCase().trim();
    return (m.title && m.title.toLowerCase().includes(q)) || (m.proker && m.proker.toLowerCase().includes(q));
  });

  return (
    <div className="modal-backdrop active" role="dialog" aria-modal="true">
      <div className="admin-modal-container">
        <div className="admin-modal-header">
          <div className="admin-header-title">
            <div className="admin-avatar"><i className="fa-solid fa-user-gear"></i></div>
            <div>
              <h3 className="admin-title">Dasbor Arsiparis & Admin</h3>
              <span className="admin-sub">Kelola kenangan proker, unggah foto dokumentasi, dan pesan apresiasi</span>
            </div>
          </div>
          <div className="admin-header-actions">
            <button className="btn btn-outline btn-sm" onClick={onLogout}>
              <i className="fa-solid fa-arrow-right-from-bracket"></i> Keluar
            </button>
            <button className="modal-close-btn relative" onClick={onClose} aria-label="Tutup">
              <i className="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        {/* Admin Tabs */}
        <div className="admin-tabs">
          <button
            className={`admin-tab ${activeTab === 'tabUpload' ? 'active' : ''}`}
            onClick={() => setActiveTab('tabUpload')}
          >
            <i className="fa-solid fa-cloud-arrow-up"></i> Unggah Foto Baru
          </button>
          <button
            className={`admin-tab ${activeTab === 'tabManage' ? 'active' : ''}`}
            onClick={() => setActiveTab('tabManage')}
          >
            <i className="fa-solid fa-photo-film"></i> Kelola Foto ({memories.length})
          </button>
          <button
            className={`admin-tab ${activeTab === 'tabMessages' ? 'active' : ''}`}
            onClick={() => setActiveTab('tabMessages')}
          >
            <i className="fa-solid fa-comments"></i> Kelola Pesan ({messages.length})
          </button>
          <button
            className={`admin-tab ${activeTab === 'tabSettings' ? 'active' : ''}`}
            onClick={() => setActiveTab('tabSettings')}
          >
            <i className="fa-solid fa-sliders"></i> Cadangan Data
          </button>
        </div>

        {/* Tab Content */}
        <div className="admin-modal-body">
          {/* TAB 1: UPLOAD FOTO */}
          {activeTab === 'tabUpload' && (
            <div className="tab-panel active">
              <form className="upload-form" onSubmit={handleUploadSubmit}>
                <div className="upload-grid-layout">
                  {/* Dropzone Column */}
                  <div className="dropzone-column">
                    <label className="form-label">Foto Dokumentasi Kenangan</label>
                    <div
                      className="dropzone-box"
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={(e) => {
                        e.preventDefault();
                        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                          handleImageFile(e.dataTransfer.files[0]);
                        }
                      }}
                    >
                      <input
                        type="file"
                        ref={fileInputRef}
                        accept="image/*"
                        className="file-input-hidden"
                        onChange={(e) => {
                          if (e.target.files && e.target.files[0]) {
                            handleImageFile(e.target.files[0]);
                          }
                        }}
                      />

                      {!photoPreview ? (
                        <div className="dropzone-prompt">
                          <div className="dropzone-icon"><i className="fa-solid fa-images"></i></div>
                          <h4>Pilih atau Tarik Foto ke Sini</h4>
                          <p>Format JPG, PNG, WEBP. Teroptimasi otomatis.</p>
                          <span className="btn btn-sm btn-outline mt-2">Pilih Berkas Foto</span>
                        </div>
                      ) : (
                        <div className="dropzone-preview">
                          <img src={photoPreview} alt="Pratinjau Foto" />
                          <button
                            type="button"
                            className="btn-change-photo"
                            onClick={(e) => {
                              e.stopPropagation();
                              setPhotoPreview(null);
                            }}
                          >
                            <i className="fa-solid fa-arrow-rotate-left"></i> Ganti
                          </button>
                        </div>
                      )}
                    </div>

                    <div className="url-alt-wrapper">
                      <span className="url-divider">atau gunakan tautan gambar (opsional)</span>
                      <div className="url-input-group">
                        <input
                          type="url"
                          className="form-input"
                          value={urlInput}
                          onChange={(e) => setUrlInput(e.target.value)}
                          placeholder="https://images.unsplash.com/..."
                        />
                        <button
                          type="button"
                          className="btn btn-sm btn-outline"
                          onClick={() => {
                            if (urlInput.trim()) setPhotoPreview(urlInput.trim());
                          }}
                        >
                          Muat URL
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Metadata Fields */}
                  <div className="metadata-column">
                    <div className="form-group">
                      <label className="form-label">Judul Momen / Foto *</label>
                      <input
                        type="text"
                        className="form-input"
                        value={title}
                        onChange={(e) => setTitle(e.target.value)}
                        placeholder="Contoh: Evaluasi Malam Terakhir & Pelukan Haru"
                        required
                      />
                    </div>

                    <div className="form-row">
                      <div className="form-group col-half">
                        <label className="form-label">Program Kerja (Proker) *</label>
                        <input
                          type="text"
                          className="form-input"
                          value={proker}
                          onChange={(e) => setProker(e.target.value)}
                          placeholder="Contoh: Makrab 2024"
                          required
                        />
                      </div>
                      <div className="form-group col-half">
                        <label className="form-label">Tanggal Kegiatan</label>
                        <input
                          type="date"
                          className="form-input"
                          value={date}
                          onChange={(e) => setDate(e.target.value)}
                        />
                      </div>
                    </div>

                    <div className="form-group">
                      <label className="form-label">Kakak / Pengurus Terkait (Pisahkan dengan koma)</label>
                      <input
                        type="text"
                        className="form-input"
                        value={people}
                        onChange={(e) => setPeople(e.target.value)}
                        placeholder="Contoh: Kak Dika, Kak Sarah, Kak Reza"
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Catatan & Cerita di Balik Layar *</label>
                      <textarea
                        className="form-input textarea-field"
                        rows="4"
                        value={story}
                        onChange={(e) => setStory(e.target.value)}
                        placeholder="Tuliskan cerita menarik, tantangan bersama, atau apresiasi untuk momen ini..."
                        required
                      ></textarea>
                    </div>

                    <div className="form-checkbox-group">
                      <label className="custom-checkbox">
                        <input
                          type="checkbox"
                          checked={featured}
                          onChange={(e) => setFeatured(e.target.checked)}
                        />
                        <span className="checkmark"></span>
                        <span className="checkbox-text">Sematkan sebagai Momen Sorotan (Featured)</span>
                      </label>
                    </div>

                    <div className="form-actions mt-3">
                      <button type="submit" className="btn btn-primary btn-lg">
                        <i className="fa-solid fa-cloud-arrow-up"></i> Simpan ke Ruang Jejak
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* TAB 2: KELOLA DAFTAR FOTO */}
          {activeTab === 'tabManage' && (
            <div className="tab-panel active">
              <div className="manage-toolbar">
                <div className="search-input-wrapper sm">
                  <i className="fa-solid fa-magnifying-glass search-icon"></i>
                  <input
                    type="text"
                    value={adminSearch}
                    onChange={(e) => setAdminSearch(e.target.value)}
                    placeholder="Cari foto berdasarkan judul atau proker..."
                  />
                </div>
                <div className="manage-stats-pill">
                  Total Foto: <strong>{filteredAdminMemories.length}</strong>
                </div>
              </div>

              <div className="manage-table-container">
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>Pratinjau</th>
                      <th>Judul & Tanggal</th>
                      <th>Program Kerja</th>
                      <th>Kakak Terlibat</th>
                      <th>Sorotan</th>
                      <th className="text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredAdminMemories.length > 0 ? (
                      filteredAdminMemories.map(m => {
                        const peopleStr = Array.isArray(m.people) ? m.people.join(', ') : (m.people || '-');
                        return (
                          <tr key={m.id}>
                            <td>
                              <img src={m.image} className="table-thumb" alt={m.title} />
                            </td>
                            <td>
                              <strong>{m.title}</strong><br />
                              <small className="text-muted">{formatDateIndonesian(m.date)}</small>
                            </td>
                            <td><span className="person-tag">{m.proker}</span></td>
                            <td><small>{peopleStr}</small></td>
                            <td>
                              <button
                                className={`btn btn-sm ${m.featured ? 'btn-primary' : 'btn-outline'}`}
                                onClick={() => onToggleFeatured(m.id)}
                                title="Ubah status sorotan"
                              >
                                <i className="fa-solid fa-thumbtack"></i> {m.featured ? 'Ya' : 'Tidak'}
                              </button>
                            </td>
                            <td className="text-right">
                              <button
                                className="btn-icon danger"
                                onClick={() => onDeleteMemory(m.id)}
                                title="Hapus kenangan ini"
                              >
                                <i className="fa-regular fa-trash-can"></i>
                              </button>
                            </td>
                          </tr>
                        );
                      })
                    ) : (
                      <tr>
                        <td colSpan="6" className="text-center text-muted" style={{ padding: '2rem' }}>
                          Tidak ada foto yang cocok.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 3: KELOLA PESAN */}
          {activeTab === 'tabMessages' && (
            <div className="tab-panel active">
              <div className="manage-toolbar">
                <p className="text-muted">Daftar semua pesan apresiasi dan surat kenangan yang telah terkirim.</p>
              </div>

              <div className="manage-table-container">
                <table className="data-table">
                  <thead>
                    <tr>
                      <th>Pengirim</th>
                      <th>Untuk Kakak</th>
                      <th>Isi Pesan</th>
                      <th>Tanggal</th>
                      <th className="text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    {messages.length > 0 ? (
                      messages.map(msg => (
                        <tr key={msg.id}>
                          <td><strong>{msg.sender}</strong></td>
                          <td><span className="person-tag">{msg.recipient}</span></td>
                          <td><small>“{msg.body}”</small></td>
                          <td><small className="text-muted">{msg.date}</small></td>
                          <td className="text-right">
                            <button
                              className="btn-icon danger"
                              onClick={() => onDeleteMessage(msg.id)}
                              title="Hapus pesan ini"
                            >
                              <i className="fa-regular fa-trash-can"></i>
                            </button>
                          </td>
                        </tr>
                      ))
                    ) : (
                      <tr>
                        <td colSpan="5" className="text-center text-muted" style={{ padding: '2rem' }}>
                          Belum ada surat tersimpan.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 4: PENGATURAN & BACKUP */}
          {activeTab === 'tabSettings' && (
            <div className="tab-panel active">
              <div className="settings-card-grid">
                <div className="settings-card">
                  <h4><i className="fa-solid fa-file-export"></i> Cadangkan Data (Ekspor JSON)</h4>
                  <p>Unduh seluruh data galeri, foto, dan surat kenangan ke dalam berkas cadangan JSON di perangkatmu.</p>
                  <button className="btn btn-outline mt-2" onClick={exportBackupJSON}>
                    <i className="fa-solid fa-download"></i> Unduh Cadangan JSON
                  </button>
                </div>

                <div className="settings-card">
                  <h4><i className="fa-solid fa-file-import"></i> Pulihkan Data (Impor JSON)</h4>
                  <p>Muat berkas cadangan JSON yang sebelumnya pernah diunduh.</p>
                  <input
                    type="file"
                    ref={importInputRef}
                    accept=".json"
                    className="file-input-hidden"
                    onChange={handleImportFile}
                  />
                  <button
                    className="btn btn-outline mt-2"
                    onClick={() => importInputRef.current && importInputRef.current.click()}
                  >
                    <i className="fa-solid fa-upload"></i> Pilih Berkas Impor
                  </button>
                </div>

                <div className="settings-card danger">
                  <h4><i className="fa-solid fa-rotate-left"></i> Pulihkan Kenangan Bawaan</h4>
                  <p>Kembalikan data galeri dan pesan ke contoh awal yang rapi dan elegan.</p>
                  <button className="btn btn-outline-danger mt-2" onClick={onResetDefaults}>
                    <i className="fa-solid fa-arrow-rotate-left"></i> Reset ke Data Bawaan
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// SUB-COMPONENT: DetailModal (Lightbox)
// ============================================================================
function DetailModal({ memory, isLiked, isAdmin, onClose, onDeleteMemory, onToggleLike, onShare }) {
  const peopleList = Array.isArray(memory.people) ? memory.people : (memory.people ? memory.people.split(',') : []);

  return (
    <div className="modal-backdrop active" role="dialog" aria-modal="true">
      <div className="detail-modal-container">
        <button className="modal-close-btn" onClick={onClose} aria-label="Tutup">
          <i className="fa-solid fa-xmark"></i>
        </button>

        <div className="detail-grid">
          <div className="detail-media">
            <img src={memory.image} alt={memory.title} />
            <div className="detail-badge-corner">{memory.proker}</div>
          </div>

          <div className="detail-info">
            <div className="detail-meta-top">
              <span className="detail-date">
                <i className="fa-regular fa-calendar"></i> {formatDateIndonesian(memory.date)}
              </span>
              <span
                className={`detail-likes-pill ${isLiked ? 'liked' : ''}`}
                onClick={onToggleLike}
                style={{ cursor: 'pointer' }}
              >
                <i className={`${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart`}></i> {memory.likes || 0} Suka
              </span>
            </div>

            <h3 className="detail-title">{memory.title}</h3>

            <div className="detail-people-box">
              <span className="detail-people-label"><i className="fa-solid fa-users"></i> Kakak & Pengurus:</span>
              <div className="detail-people-tags">
                {peopleList.length > 0 ? (
                  peopleList.map((p, idx) => (
                    <span key={idx} className="person-tag">{p.trim()}</span>
                  ))
                ) : (
                  <span className="person-tag">Seluruh Panitia & Pengurus</span>
                )}
              </div>
            </div>

            <div className="detail-story-box">
              <h5 className="story-heading">Cerita di Balik Layar</h5>
              <p className="detail-story-text">{memory.story}</p>
            </div>

            <div className="detail-footer-actions">
              <button className="btn btn-outline btn-sm" onClick={onShare}>
                <i className="fa-solid fa-share-nodes"></i> Bagikan
              </button>
              {isAdmin && (
                <button
                  type="button"
                  className="btn btn-outline-danger btn-sm"
                  onClick={() => onDeleteMemory(memory.id)}
                  title="Hapus foto ini (Admin)"
                >
                  <i className="fa-regular fa-trash-can"></i> Hapus Foto
                </button>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// SUB-COMPONENT: WriteModal (Surat Kasih untuk Kakak)
// ============================================================================
function WriteModal({ isOpen, onClose, onSubmit }) {
  const [sender, setSender] = useState('');
  const [recipient, setRecipient] = useState('');
  const [prokerRef, setProkerRef] = useState('');
  const [body, setBody] = useState('');
  const [theme, setTheme] = useState('parchment');

  if (!isOpen) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    const newMsg = {
      id: 'msg-' + Date.now(),
      sender: sender.trim(),
      recipient: recipient.trim(),
      prokerRef: prokerRef.trim(),
      body: body.trim(),
      date: formatDateIndonesian(new Date().toISOString().split('T')[0]),
      theme
    };
    onSubmit(newMsg);
    onClose();

    // Scroll smoothly to messages section
    setTimeout(() => {
      const el = document.getElementById('pesan');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }, 200);
  };

  return (
    <div className="modal-backdrop active" role="dialog" aria-modal="true">
      <div className="envelope-style-modal">
        <button className="modal-close-btn" onClick={onClose} aria-label="Tutup">
          <i className="fa-solid fa-xmark"></i>
        </button>

        <div className="parchment-letter-card">
          <div className="parchment-header">
            <span className="parchment-tag">Surat Kasih & Ucapan</span>
            <h3 className="parchment-title">Torehkan Jejak Kata untuk Kakak</h3>
            <p className="parchment-sub">Kata-katamu adalah pelipur lelah terbaik bagi kakak pengurus yang telah mendedikasikan energinya.</p>
          </div>

          <form className="letter-form" onSubmit={handleSubmit}>
            <div className="form-row">
              <div className="form-group col-half">
                <label className="form-label">Namamu / Inisial *</label>
                <input
                  type="text"
                  className="form-input"
                  value={sender}
                  onChange={(e) => setSender(e.target.value)}
                  placeholder="Contoh: Rian (Divisi Acara 24)"
                  required
                />
              </div>
              <div className="form-group col-half">
                <label className="form-label">Ditujukan Kepada *</label>
                <input
                  type="text"
                  className="form-input"
                  value={recipient}
                  onChange={(e) => setRecipient(e.target.value)}
                  placeholder="Contoh: Kak Zahra / Seluruh BPH"
                  required
                />
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Momen / Proker Paling Berkesan Bersama Beliau</label>
              <input
                type="text"
                className="form-input"
                value={prokerRef}
                onChange={(e) => setProkerRef(e.target.value)}
                placeholder="Contoh: Waktu gladi bersih Makrab & evaluasi tengah malam"
              />
            </div>

            <div className="form-group">
              <label className="form-label">Isi Surat / Ucapan Terima Kasih *</label>
              <textarea
                className="form-input textarea-field"
                rows="4"
                value={body}
                onChange={(e) => setBody(e.target.value)}
                placeholder="Tuliskan ucapan terima kasih, kesan berharga, dan doa untuk langkah kakak ke depannya..."
                required
              ></textarea>
            </div>

            <div className="form-group">
              <label className="form-label">Pilih Corak Kertas Surat</label>
              <div className="letter-theme-selector">
                <label className={`theme-choice ${theme === 'parchment' ? 'active' : ''}`}>
                  <input
                    type="radio"
                    name="letterTheme"
                    value="parchment"
                    checked={theme === 'parchment'}
                    onChange={() => setTheme('parchment')}
                  />
                  <span className="theme-preview bg-parchment"></span>
                  <span>Klasik</span>
                </label>
                <label className={`theme-choice ${theme === 'sage' ? 'active' : ''}`}>
                  <input
                    type="radio"
                    name="letterTheme"
                    value="sage"
                    checked={theme === 'sage'}
                    onChange={() => setTheme('sage')}
                  />
                  <span className="theme-preview bg-sage"></span>
                  <span>Sejuk</span>
                </label>
                <label className={`theme-choice ${theme === 'blush' ? 'active' : ''}`}>
                  <input
                    type="radio"
                    name="letterTheme"
                    value="blush"
                    checked={theme === 'blush'}
                    onChange={() => setTheme('blush')}
                  />
                  <span className="theme-preview bg-blush"></span>
                  <span>Hangat</span>
                </label>
              </div>
            </div>

            <button type="submit" className="btn btn-primary w-100 btn-lg mt-3">
              <i className="fa-solid fa-paper-plane"></i> Kirim Surat ke Dinding Apresiasi
            </button>
          </form>
        </div>
      </div>
    </div>
  );
}

if (container) {
  const root = ReactDOM.createRoot(container);
  root.render(<App />);
